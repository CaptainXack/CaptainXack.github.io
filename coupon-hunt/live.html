<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Coupon Hunt HQ</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<style>
:root{--bg:#08111f;--panel:#101b2c;--text:#f7fbff;--muted:#9eb0c8;--line:rgba(255,255,255,.09);--green:#38d67a;--amber:#ffbf47;--blue:#67a9ff;--red:#ff6b6b}*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#08111f,#0c1627 45%,#08111f);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{min-height:100vh}a{color:inherit;text-decoration:none}.shell{max-width:820px;margin:auto;padding:14px 14px 104px}.top{position:sticky;top:0;z-index:20;padding:10px 0;background:linear-gradient(180deg,rgba(8,17,31,.98),rgba(8,17,31,.9),rgba(8,17,31,.1));backdrop-filter:blur(10px)}.hero{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#38d67a,#4b8dff);display:grid;place-items:center;font-size:24px}h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}.right{display:flex;align-items:center;gap:7px}.badge,.refresh,.install{border:1px solid var(--line);background:#142238;color:white;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:900}.refresh,.install{cursor:pointer}.install{display:none;background:#19395f}.sync{margin-top:9px;display:flex;align-items:center;gap:8px;color:#aabbd0;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}.dot.live{background:var(--green)}.search{margin-top:10px}.search input{width:100%;background:#101b2c;color:white;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px}.filters{display:flex;gap:7px;overflow:auto;padding:9px 0 4px;scrollbar-width:none}.chip{border:1px solid var(--line);background:#111d30;color:#d2dfec;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:850;white-space:nowrap}.chip.active{background:#e9f9ef;color:#0b5b2d;border-color:#7ee7a6}.grid{display:grid;gap:11px;margin-top:10px}.deal{background:linear-gradient(180deg,#111e31,#0e1929);border:1px solid var(--line);border-radius:20px;padding:14px}.deal.use{border-color:rgba(56,214,122,.3)}.deal.upcoming{border-color:rgba(103,169,255,.35)}.deal.check{border-color:rgba(255,191,71,.35)}.row{display:flex;justify-content:space-between;gap:10px}.status{font-size:11px;font-weight:950;border-radius:999px;padding:6px 8px;background:#17263d}.use .status{color:#7af0a6}.upcoming .status{color:#a7cbff}.check .status{color:#ffd681}.price{font-size:20px;font-weight:950}.title{font-size:16px;font-weight:900;line-height:1.3;margin:10px 0 7px}.meta{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:11px;font-weight:800;color:#d7e3f0;background:#18273e;border:1px solid var(--line);border-radius:999px;padding:6px 8px}.yes{color:#76ef9f}.no{color:#ff9e9e}.maybe{color:#ffd681}.codebox{margin-top:10px;display:flex;justify-content:space-between;gap:8px;padding:10px 11px;border-radius:13px;background:#081321;border:1px dashed rgba(255,255,255,.15)}.code{font-family:ui-monospace,Consolas,monospace;font-weight:900}.copy{border:0;background:#233a5b;color:white;border-radius:10px;padding:7px 10px;font-weight:900}.rule{color:var(--muted);font-size:12px;line-height:1.45;margin-top:9px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.btn{padding:11px;border-radius:12px;text-align:center;font-weight:900;font-size:13px;background:#1b3150;border:1px solid rgba(103,169,255,.22)}.btn.primary{background:linear-gradient(135deg,#2f77ff,#4f91ff);border:0}.empty{text-align:center;color:var(--muted);padding:50px 20px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(8,17,31,.96);border-top:1px solid var(--line);backdrop-filter:blur(14px);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.nav{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#91a5be;font-size:10px;font-weight:800;padding:6px 2px;border-radius:11px}.nav a.active{background:#13243a;color:white}.nav b{font-size:19px}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="shell"><div class="top"><div class="hero"><div class="brand"><div class="logo">🛒</div><div><h1>Coupon Hunt HQ</h1><div class="sub">Live deals, coupons and verified stacking</div></div></div><div class="right"><button class="install" id="install">Install</button><button class="refresh" id="refresh">↻</button><span class="badge" id="count">0</span></div></div><div class="sync"><span class="dot" id="dot"></span><span id="syncText">Loading latest deals…</span></div><div class="search"><input id="search" type="search" placeholder="Search deal, brand or shop…"></div><div class="filters" id="filters"><button class="chip active" data-f="all">All</button><button class="chip" data-f="free">Free</button><button class="chip" data-f="50">50%+</button><button class="chip" data-f="pet">Pets</button><button class="chip" data-f="food">Food</button><button class="chip" data-f="cleaning">Cleaning</button><button class="chip" data-f="stack">Stacks</button></div></div><main class="grid" id="grid"></main></div>
<nav class="bottom"><div class="nav"><a class="active" href="./live.html"><b>🔥</b><span>Deals</span></a><a href="https://docs.google.com/spreadsheets/d/1m84H2RAxcetcCEjeetuYS_BivtEaSPr4jkB_VLdJ0OQ/edit#gid=1006"><b>🎟️</b><span>Coupons</span></a><a href="https://docs.google.com/spreadsheets/d/1m84H2RAxcetcCEjeetuYS_BivtEaSPr4jkB_VLdJ0OQ/edit#gid=2017"><b>🧾</b><span>Claims</span></a><a href="https://docs.google.com/spreadsheets/d/1m84H2RAxcetcCEjeetuYS_BivtEaSPr4jkB_VLdJ0OQ/edit#gid=2018"><b>🔁</b><span>Subs</span></a><a href="https://docs.google.com/spreadsheets/d/1m84H2RAxcetcCEjeetuYS_BivtEaSPr4jkB_VLdJ0OQ/edit#gid=1555405136"><b>🏪</b><span>In store</span></a></div></nav>
<script>
const FEED='https://docs.google.com/spreadsheets/d/1m84H2RAxcetcCEjeetuYS_BivtEaSPr4jkB_VLdJ0OQ/gviz/tq?tqx=out:json&sheet=DEALS%20-%20SIMPLE&range=A4:K1000';
const KEY='couponHuntDealsV2',STAMP='couponHuntSyncV2';let deals=[],filter='all',deferredPrompt=null;
const norm=v=>(v??'').toString().trim();
function parseRow(r){return r.c.map(c=>c?(c.f??c.v??''):'')}
function cacheSave(rows){localStorage.setItem(KEY,JSON.stringify(rows));localStorage.setItem(STAMP,new Date().toISOString())}
function cacheLoad(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function setSync(live){const d=document.getElementById('dot'),t=document.getElementById('syncText');d.classList.toggle('live',live);const s=localStorage.getItem(STAMP);t.textContent=live?'Live • updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):(s?'Offline copy • last synced '+new Date(s).toLocaleString():'No saved copy yet')}
async function load(showCached=true){if(showCached){const c=cacheLoad();if(c.length){deals=c;render();setSync(false)}}try{const res=await fetch(FEED,{cache:'no-store'});if(!res.ok)throw new Error();const txt=await res.text(),a=txt.indexOf('{'),b=txt.lastIndexOf('}');const obj=JSON.parse(txt.slice(a,b+1));let rows=obj.table.rows.map(parseRow);if(rows.length&&norm(rows[0][0]).toUpperCase()==='STATUS')rows.shift();rows=rows.filter(r=>norm(r[1]));if(!rows.length)throw new Error();deals=rows;cacheSave(rows);setSync(true);render()}catch{if(!deals.length){deals=cacheLoad();render()}setSync(false)}}
function category(d){const x=(d[1]+' '+d[5]).toLowerCase();if(/pet|dog|cat|puppy|kitten|blink|forthglade|tails|pooch|burns|harringtons|zooplus|thrive|lily/.test(x))return'pet';if(/vax|clean|laundry|smol|method|delphis|astonish|kärcher/.test(x))return'cleaning';if(/food|drink|pepsi|kellogg|spice|breakfast|swizzels|lavazza|sainsbury|morrisons|tesco|asda/.test(x))return'food';return'other'}
function matches(d){const q=document.getElementById('search').value.toLowerCase(),text=d.join(' ').toLowerCase();if(q&&!text.includes(q))return false;if(filter==='all')return true;if(filter==='free')return /£0|free|100%/.test(text);if(filter==='50')return /(?:[5-9][0-9]|100)%/.test(text);if(filter==='stack')return norm(d[6]).includes('YES');return category(d)===filter}
function safe(u){return /^https?:\/\//i.test(norm(u))?u:'#'}
function render(){const g=document.getElementById('grid'),shown=deals.filter(matches);document.getElementById('count').textContent=shown.length;g.innerHTML=shown.length?'':'<div class="empty">No matching deals.</div>';shown.forEach(d=>{const st=norm(d[0]),cls=st.includes('UPCOMING')?'upcoming':st.includes('CHECK')?'check':'use',stack=norm(d[6]),sc=stack.includes('YES')?'yes':stack.includes('NO')?'no':'maybe',code=norm(d[4]),price=norm(d[2]),save=norm(d[3]),where=norm(d[5]),rule=norm(d[7]),exp=norm(d[8]);const el=document.createElement('article');el.className='deal '+cls;el.innerHTML=`<div class="row"><span class="status">${st||'DEAL'}</span>${price?`<span class="price">${price}</span>`:''}</div><div class="title">${norm(d[1])}</div><div class="meta">${save?`<span class="pill">Save ${save}</span>`:''}${where?`<span class="pill">${where}</span>`:''}${stack?`<span class="pill ${sc}">${stack}</span>`:''}${exp?`<span class="pill">Ends ${exp}</span>`:''}</div>${code?`<div class="codebox"><span class="code">${code}</span><button class="copy" data-code="${code.replace(/"/g,'&quot;')}">COPY</button></div>`:''}${rule?`<div class="rule">${rule}</div>`:''}<div class="buttons"><a class="btn primary" href="${safe(d[9])}" target="_blank" rel="noopener">GET DEAL</a><a class="btn" href="${safe(d[10])}" target="_blank" rel="noopener">TERMS</a></div>`;g.appendChild(el)});document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.code);b.textContent='COPIED';setTimeout(()=>b.textContent='COPY',1200)}catch{}})}
document.getElementById('search').addEventListener('input',render);document.getElementById('filters').onclick=e=>{if(!e.target.dataset.f)return;filter=e.target.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===e.target));render()};document.getElementById('refresh').onclick=()=>load(false);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install').style.display='inline-block'});document.getElementById('install').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('install').style.display='none'};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');load(true);setInterval(()=>load(false),300000);window.addEventListener('online',()=>load(false));
</script></body></html>
